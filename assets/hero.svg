<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Christian Martin · @ChrisMG89 · Creador de PROMETEO: un humano, un escuadrón de agentes de IA, una casa que piensa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d19"/>
      <stop offset="1" stop-color="#101c3f"/>
    </linearGradient>
    <radialGradient id="orb" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.38" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.07"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .orbit1 { transform-origin: 960px 170px; animation: spin 14s linear infinite; }
      .orbit2 { transform-origin: 960px 170px; animation: spin 22s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: 960px 170px; }
      @keyframes pulse { 50% { transform: scale(1.04); } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#38bdf8" stroke-opacity="0.25"/>

  <!-- Núcleo PROMETEO -->
  <g class="pulse">
    <circle cx="960" cy="170" r="74" fill="url(#orb)" filter="url(#glow)"/>
    <circle cx="960" cy="170" r="74" fill="none" stroke="#e0f2fe" stroke-opacity="0.35"/>
  </g>
  <ellipse cx="960" cy="170" rx="150" ry="46" fill="none" stroke="url(#ring)" stroke-width="2" transform="rotate(-18 960 170)" stroke-opacity="0.9"/>
  <ellipse cx="960" cy="170" rx="118" ry="118" fill="none" stroke="#38bdf8" stroke-opacity="0.18" stroke-dasharray="3 9"/>
  <g class="orbit1">
    <circle cx="1110" cy="170" r="7" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="810" cy="170" r="5" fill="#a855f7"/>
  </g>
  <g class="orbit2">
    <circle cx="960" cy="52" r="6" fill="#f59e0b"/>
    <circle cx="960" cy="288" r="5" fill="#22c55e"/>
  </g>

  <!-- Texto -->
  <text x="64" y="74" class="mono" font-size="15" fill="#38bdf8" fill-opacity="0.85" letter-spacing="3">/ 001 · GITHUB.COM/CHRISMG89</text>
  <text x="64" y="158" class="sans" font-size="70" font-weight="800" fill="url(#title)">Christian Martin</text>
  <text x="66" y="200" class="mono" font-size="26" fill="#38bdf8">@ChrisMG89</text>
  <text x="66" y="244" class="mono" font-size="19" fill="#cbd5e1">$ whoami</text>
  <text x="66" y="274" class="mono" font-size="19" fill="#f8fafc">un humano · 18 agentes · una casa que piensa<tspan class="cursor" fill="#38bdf8"> ▌</tspan></text>
  <text x="66" y="312" class="mono" font-size="13" fill="#64748b" letter-spacing="2">CREADOR DE PROMETEO · IA · DOMÓTICA · MUNDOS 3D</text>
</svg>

